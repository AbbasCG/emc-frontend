# M7.D — Dependabot configuration (file only; enabling the service is a
# repo-owner action on GitHub → Settings → Code security).
# Groups minor/patch updates to keep PR noise low; security updates always open.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
